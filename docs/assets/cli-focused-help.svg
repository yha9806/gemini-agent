<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">gemini-agent focused CLI help</title>
  <desc id="desc">Terminal-style preview of gemini-agent default help and focused diff-review help.</desc>
  <rect width="920" height="360" rx="18" fill="#111827"/>
  <rect x="0" y="0" width="920" height="42" rx="18" fill="#1f2937"/>
  <circle cx="26" cy="21" r="6" fill="#ef4444"/>
  <circle cx="48" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="70" cy="21" r="6" fill="#10b981"/>
  <text x="92" y="26" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">gemini-agent</text>

  <text x="28" y="76" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">$ gemini-agent --help</text>
  <text x="28" y="108" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Common workflows:</text>
  <text x="52" y="134" fill="#d1d5db" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">gemini-agent context-pack --bootstrap --write-artifact</text>
  <text x="52" y="160" fill="#d1d5db" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">gemini-agent diff-review --smart-diff</text>
  <text x="52" y="186" fill="#d1d5db" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">gemini-agent visual gate --actual-screenshot after.png --json</text>

  <line x1="28" x2="892" y1="214" y2="214" stroke="#374151" stroke-width="1"/>

  <text x="28" y="246" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">$ gemini-agent diff-review --help</text>
  <text x="28" y="278" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Usage: gemini-agent diff-review (--smart-diff | --diff | --stdin | --file &lt;path&gt; ...)</text>
  <text x="28" y="306" fill="#d1d5db" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Reviews the current patch for risks, missing tests, unsafe claims, and suggested changes.</text>
  <text x="28" y="334" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Default help stays short. Use focused help when you need command details.</text>
</svg>
