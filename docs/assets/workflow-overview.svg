<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">gemini-agent workflow overview</title>
  <desc id="desc">Diagram showing Codex or a human operator using gemini-agent as a local gate to ask Gemini for bounded review, visual, design, and telemetry judgment before local execution.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .titleText { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 500; fill: #475569; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 600; fill: #64748b; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #0f172a; }
      .pillText { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; }
      .softArrow { stroke: #94a3b8; stroke-width: 1.8; fill: none; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="960" height="540" rx="8" fill="#f8fafc"/>
  <rect x="24" y="22" width="912" height="496" rx="8" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="54" y="62" class="titleText">gemini-agent in the Codex workflow</text>
  <text x="54" y="88" class="body">Gemini gives bounded judgment. Codex or the human keeps execution authority.</text>

  <rect x="50" y="132" width="190" height="112" rx="8" fill="#eff6ff" stroke="#bfdbfe" filter="url(#shadow)"/>
  <text x="74" y="166" class="label">Codex / human</text>
  <text x="74" y="194" class="body">Owns the task</text>
  <text x="74" y="216" class="body">Chooses the gate</text>

  <rect x="338" y="112" width="284" height="196" rx="8" fill="#f8fafc" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="366" y="146" class="label">gemini-agent</text>
  <text x="366" y="170" class="body">Local CLI or MCP coprocessor</text>
  <rect x="366" y="194" width="114" height="30" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="382" y="214" class="pillText">context-pack</text>
  <rect x="494" y="194" width="100" height="30" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="514" y="214" class="pillText">diff-review</text>
  <rect x="366" y="236" width="100" height="30" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="384" y="256" class="pillText">visual gate</text>
  <rect x="480" y="236" width="104" height="30" rx="8" fill="#fae8ff" stroke="#e879f9"/>
  <text x="498" y="256" class="pillText">design draft</text>
  <text x="366" y="288" class="mono">--smart-diff  --json  --stdin</text>

  <rect x="720" y="132" width="190" height="112" rx="8" fill="#f0fdf4" stroke="#bbf7d0" filter="url(#shadow)"/>
  <text x="746" y="166" class="label">Gemini API</text>
  <text x="746" y="194" class="body">Review reasoning</text>
  <text x="746" y="216" class="body">Vision and design</text>

  <rect x="338" y="368" width="284" height="108" rx="8" fill="#fffbeb" stroke="#fde68a" filter="url(#shadow)"/>
  <text x="366" y="402" class="label">Local artifacts</text>
  <text x="366" y="430" class="body">Context packs, review JSON,</text>
  <text x="366" y="452" class="body">design handoffs, telemetry reports</text>

  <rect x="50" y="362" width="218" height="118" rx="8" fill="#fff1f2" stroke="#fecdd3" filter="url(#shadow)"/>
  <text x="74" y="396" class="label">Execution stays local</text>
  <text x="74" y="424" class="body">Edit files, run tests,</text>
  <text x="74" y="446" class="body">commit, deploy, decide</text>

  <path class="arrow" d="M 242 188 C 276 188, 298 188, 334 188"/>
  <polygon points="334,188 316,178 316,198" fill="#475569"/>
  <text x="260" y="174" class="small">scoped input</text>

  <path class="arrow" d="M 622 188 C 660 188, 682 188, 716 188"/>
  <polygon points="716,188 698,178 698,198" fill="#475569"/>
  <text x="646" y="174" class="small">bounded prompt</text>

  <path class="softArrow" d="M 720 224 C 674 276, 650 286, 622 276"/>
  <polygon points="622,276 641,267 636,288" fill="#475569"/>
  <text x="656" y="302" class="small">judgment returns</text>

  <path class="arrow" d="M 480 310 C 480 332, 480 344, 480 364"/>
  <polygon points="480,364 470,346 490,346" fill="#475569"/>
  <text x="496" y="342" class="small">writes</text>

  <path class="arrow" d="M 338 430 C 302 430, 292 430, 272 430"/>
  <polygon points="272,430 290,420 290,440" fill="#475569"/>
  <text x="284" y="416" class="small">feeds back</text>

  <path class="arrow" d="M 155 244 C 155 288, 155 316, 155 358"/>
  <polygon points="155,358 145,340 165,340" fill="#475569"/>
  <text x="172" y="304" class="small">final authority</text>

  <text x="54" y="508" class="small">Use it as a review and artifact gate, not as another source-editing agent.</text>
</svg>
