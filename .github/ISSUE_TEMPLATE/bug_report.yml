name: Bug report
description: Report a reproducible gemini-agent problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include API keys, bearer tokens, raw telemetry exports, private screenshots, customer data, or unredacted prompts/responses.
  - type: dropdown
    id: workflow
    attributes:
      label: Affected workflow
      options:
        - auth or setup
        - context-pack
        - plan/patch/diff/research review gate
        - artifact-review or visual gate
        - design workflow
        - MCP server
        - telemetry
        - install-codex-global
        - other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands, small fixtures, or redacted input needed to reproduce.
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste safe, redacted output only.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: For example, v0.1.0 or a git commit SHA.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "node --version"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 15, Ubuntu 24.04, etc."
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, raw telemetry, private screenshots, customer data, and unredacted prompts/responses.
          required: true
